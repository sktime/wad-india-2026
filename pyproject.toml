[project]
name = "WAD-India-2026"
version = "0.1.0"
description = "Workshop materials for sktime at WeAreDevelopers India 2026"
requires-python = ">=3.11,<3.14"
dependencies = [
    # core
    "sktime>=1.3.0",
    "skpro",
    "scikit-learn",
    "statsmodels",
    "pmdarima",
    "pandas",
    "numpy",
    "matplotlib",
    "seaborn",
    # deep learning and foundation models
    "torch",
    "transformers",
    "accelerate",
    "peft",
    "timesfm[torch]>=3.0.0,<4.0.0",
    "pytorch-forecasting>=1.8.0",
    # LLM-assisted forecasting
    "litellm",
    # notebooks
    "jupyter",
    "ipykernel",
]

[tool.poetry]
package-mode = false

[tool.uv]
package = false
