[project]
name = "WAD-India-2026"
version = "0.1.0"
description = "Workshop materials for sktime at WeAreDevelopers India 2026"
requires-python = ">=3.11,<3.14"
dependencies = [
    "sktime>=1.0.0",
    "ipykernel>=6.29.5,<6.30.0",
    "jupyter",
    "statsmodels>=0.14.4,<0.15.0",
    "pandas>=2.2.3",
    "matplotlib>=3.10.0,<3.12.0",
    "seaborn>=0.13.2,<0.14.0",
    "pytest>=9.0.0,<9.2.0",
    "holidays>=0.80",
    "numpy>1",
    "pmdarima",
    "skpro",
    "pytorch-forecasting",
    "litellm[caching]",
    "rdata",
    "requests",
    "plotly",
]

[tool.poetry]
package-mode = false

[tool.uv]
package = false